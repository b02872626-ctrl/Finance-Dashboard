name: CI

# Runs every unit test (parsers, money totals, sync key, PIN, crash-report
# scrubbing) and a debug build on every push and pull request, so most
# mistakes are caught before anything reaches main or the download page.
# Needs no secrets: without local.properties, Supabase and Sentry are off.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug build
        run: ./gradlew assembleDebug
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
