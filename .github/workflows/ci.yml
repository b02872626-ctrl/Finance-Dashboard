name: CI

# Runs every unit test (parsers, money totals, sync key, PIN, crash-report
# scrubbing) and a debug build on every push and pull request, so most
# mistakes are caught before anything reaches main or the download page.
# Needs no secrets: without local.properties, Supabase and Sentry are off.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug build
        run: ./gradlew assembleDebug
      # The web dashboard's insight numbers (Web/insights.js). The time zone
      # pins day boundaries to Addis Ababa, like the users'.
      - name: Web insight tests
        run: TZ=Africa/Addis_Ababa node --test tests/web/insights.test.mjs
      # Fails when a new supabase/*.sql file is missing from the staging list.
      - name: Staging setup script is complete
        run: sh supabase/staging/build_setup.sh
      # One user can't touch another's rows (supabase/staging/README.md).
      # Skipped when the two staging secrets aren't set.
      - name: Cross-user isolation test (staging)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: python3 supabase/staging/isolation_test.py
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
