name: Test APK

# Builds a debug APK of any branch for a phone check, on request: Actions →
# Test APK → Run workflow (once this file is on main), or a push whose commit
# message contains "[apk]". The build points at the staging Supabase project
# through the two staging secrets; without them Supabase is off, as in CI.
# Not a release: those come from scripts/release.sh on main.

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point the build at staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$STAGING_SUPABASE_URL" ] && [ -n "$STAGING_SUPABASE_ANON_KEY" ]; then
            printf 'supabase.url=%s\nsupabase.anonKey=%s\n' "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_ANON_KEY" > local.properties
            echo "Supabase: staging"
          else
            echo "Supabase: off (staging secrets not set)"
          fi
      - name: Debug build
        run: ./gradlew assembleDebug
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: kash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
