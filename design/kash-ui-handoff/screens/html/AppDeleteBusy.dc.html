<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Deleting account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
.spin{animation:k-spin 0.9s linear infinite}@keyframes k-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--slate-ink); font-family: var(--font-sans); display: flex; align-items: center; padding: 0 16px; overflow: hidden">

  <div role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-body" style="width: 100%; box-sizing: border-box; background: var(--surface); color: var(--ink); border-radius: var(--radius-sheet); padding: 24px 22px 18px; display: flex; flex-direction: column; gap: 18px">
    <div>
      <h2 id="del-title" class="title-m" style="margin: 0">Delete your account?</h2>
      <p id="del-body" class="body" style="margin: 8px 0 0; color: var(--ink-muted); font-weight: 400">This permanently removes your transactions, categories and settings from Kash's servers and clears them from this phone.</p>
    </div>

    <ul style="list-style: none; margin: 0; padding: 14px 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card); display: flex; flex-direction: column; gap: 10px">
      <li class="body" style="display: flex; gap: 10px; align-items: center"><x-import component-from-global-scope="Kash.Icon" name="sms" size="{{icon}}"></x-import>Your bank SMS stay on the phone</li>
      <li class="body" style="display: flex; gap: 10px; align-items: center"><x-import component-from-global-scope="Kash.Icon" name="lock" size="{{icon}}"></x-import>This can't be undone</li>
    </ul>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px">
      <button class="k-btn" aria-busy="true" disabled style="background: var(--money-out); color: var(--on-slate); cursor: default; opacity: 1"><span class="k-btn__label"><svg class="spin" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.3"></circle><path d="M21 12a9 9 0 0 0-9-9"></path></svg>Deleting your data…</span></button>
      <p class="caption" style="margin: 6px 0 0; text-align: center; color: var(--ink-muted)">Keep Kash open until this finishes.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { icon: 18 }; }
}
</script>
</body>
</html>
