<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Sign in again</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Roboto:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: var(--top-safe) var(--inset-onboarding) 28px; gap: 22px; overflow: hidden">

  <span class="wordmark" style="height: 44px; display: flex; align-items: center">kash</span>

  <div>
    <h1 class="title-l" style="margin: 0">Sign in again</h1>
    <p class="body-l" style="margin: 12px 0 0; color: var(--ink-muted)">You were signed out because your session expired. Your transactions on this phone are safe.</p>
  </div>

  <a href="AppPinCreate.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 52px; border-radius: var(--radius-control); background: #FFFFFF; border: 1px solid #747775; color: #1F1F1F; font-family: Roboto, Arial, sans-serif; font-size: 15px; font-weight: 500">
    <span aria-hidden="true" title="Official Google G mark goes here" style="width: 20px; height: 20px; border-radius: 4px; border: 1px dashed #9A9A9A; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #6F6F6F">G</span>
    Continue with Google
  </a>

  <div class="caption" style="display: flex; align-items: center; gap: 12px; color: var(--ink-muted)"><span style="flex: 1; height: 1px; background: var(--line-strong)"></span>or with email<span style="flex: 1; height: 1px; background: var(--line-strong)"></span></div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <x-import component-from-global-scope="Kash.TextField" label="Email" type="email" default-value="meron@example.com" id="em2"></x-import>
    <div class="k-field">
      <label for="pw2" class="k-field__label">Password</label>
      <input id="pw2" class="k-field__input" type="password" value="wrongpass" aria-invalid="true" aria-describedby="pw2-err" style="border-color: var(--money-out)">
      <span id="pw2-err" class="caption" role="alert" style="color: var(--money-out)">Wrong email or password.</span>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <x-import component-from-global-scope="Kash.Button" variant="primary" href="AppPinCreate.dc.html">Sign in</x-import>
    <x-import component-from-global-scope="Kash.Button" variant="quiet" href="AppSignIn.dc.html">Create a new account</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
