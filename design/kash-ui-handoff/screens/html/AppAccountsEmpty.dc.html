<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Accounts, no banks yet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 class="title-m" style="margin: 0">Accounts</h1>
    </div>
    <div style="height: 196px; box-sizing: border-box; padding: 20px; border-radius: var(--radius-card); border: 1.5px dashed var(--ghost-line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
      <span style="width: 44px; height: 44px; border-radius: var(--radius-field); background: var(--ghost-fill); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Kash.Icon" name="card" size="{{icon}}"></x-import></span>
      <span class="body-strong">No banks yet</span>
      <span class="caption" style="color: var(--on-slate-muted); max-width: 250px">A bank shows up here as soon as Kash reads one of its SMS.</span>
    </div>
  </div>

  <div class="k-screen__sheet k-screen__sheet--tabbed" style="top: 340px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; gap: 14px; padding-top: 8px">
      <h2 class="title-s" style="margin: 0">While you wait</h2>
      <a href="AppSMSDenied.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card)">
        <span style="width: 40px; height: 40px; border-radius: var(--radius-field); background: var(--well); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><x-import component-from-global-scope="Kash.Icon" name="sms" size="{{icon}}"></x-import></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="body-strong">Check SMS access</span><span class="caption" style="color: var(--ink-muted)">Kash needs it to find your banks</span></span>
        <x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import>
      </a>
      <a href="AppAdd.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card)">
        <span style="width: 40px; height: 40px; border-radius: var(--radius-field); background: var(--well); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><x-import component-from-global-scope="Kash.Icon" name="plus" size="{{icon}}"></x-import></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="body-strong">Add cash by hand</span><span class="caption" style="color: var(--ink-muted)">For money that never sends an SMS</span></span>
        <x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import>
      </a>
    </div>
    <x-import component-from-global-scope="Kash.TabBar" active="accounts" hrefs="{{tabs}}" style="position: absolute; left: 0; right: 0; bottom: 0"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      icon: 20, small: 16,
      tabs: { home: 'AppHome.dc.html', accounts: 'AppAccounts.dc.html', history: 'AppHistory.dc.html', analytics: 'AppAnalytics.dc.html' }
    };
  }
}
</script>
</body>
</html>
