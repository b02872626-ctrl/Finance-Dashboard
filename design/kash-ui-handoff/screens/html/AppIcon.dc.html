<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — App icon</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.sm{width:48px;height:48px;overflow:hidden;display:block}
</style>
</helmet>
<div style="width: 860px; height: 560px; box-sizing: border-box; padding: 40px 48px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 32px">

  <div style="display: flex; align-items: center; gap: 48px">
    <svg viewBox="0 0 108 108" role="img" aria-label="Kash app icon: three bars on slate, the first one sand" style="width: 216px; height: 216px; border-radius: 52px; display: block; flex-shrink: 0"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
    <div style="display: flex; flex-direction: column; gap: 14px; max-width: 420px">
      <h2 class="title-m" style="margin: 0">App icon</h2>
      <p class="body-l" style="margin: 0; color: var(--ink-muted)">Three bars on slate, the first in sand: your money, already sorted. The bars sit on one baseline and fit inside the adaptive-icon safe zone, so every phone shape keeps them whole.</p>
      <div style="display: flex; align-items: center; gap: 18px; margin-top: 6px">
        <svg class="sm" viewBox="0 0 108 108" aria-label="Circle mask" role="img" style="border-radius: 999px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
        <svg class="sm" viewBox="0 0 108 108" aria-label="Rounded square mask" role="img" style="border-radius: 12px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
        <svg class="sm" viewBox="0 0 108 108" aria-label="Squircle mask" role="img" style="border-radius: 18px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
        <svg class="sm" viewBox="0 0 108 108" aria-label="Monochrome themed icon" role="img" style="border-radius: 999px"><rect width="108" height="108" fill="#DDE0E6"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#3D4859"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#3D4859"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#3D4859"></rect></svg>
        <span class="caption" style="color: var(--ink-muted)">Circle, rounded, squircle, themed</span>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 16px">
    <div style="flex: 1; display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: var(--radius-card); background: #1E2229">
      <svg class="sm" viewBox="0 0 108 108" aria-hidden="true" style="border-radius: 14px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
      <span class="caption" style="color: #C6CDD8">On a dark wallpaper</span>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: var(--radius-card); background: #FFFFFF; border: 1px solid var(--line)">
      <svg class="sm" viewBox="0 0 108 108" aria-hidden="true" style="border-radius: 14px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
      <span class="caption" style="color: var(--ink-muted)">On a light wallpaper</span>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: var(--radius-card); background: #C9B99A">
      <svg class="sm" viewBox="0 0 108 108" aria-hidden="true" style="border-radius: 14px"><rect width="108" height="108" fill="#3D4859"></rect><rect x="34" y="30" width="10" height="48" rx="5" fill="#E9DFC6"></rect><rect x="50" y="44" width="10" height="34" rx="5" fill="#FFFFFF"></rect><rect x="66" y="36" width="10" height="42" rx="5" fill="#FFFFFF" fill-opacity="0.45"></rect></svg>
      <span class="caption" style="color: #2B3340">On a warm photo</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
