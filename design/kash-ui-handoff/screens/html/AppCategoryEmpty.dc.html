<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Category detail, no activity</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppAnalytics.dc.html"></x-import>
      <h1 class="title-xs" style="margin: 0">Health</h1>
      <x-import component-from-global-scope="Kash.IconButton" icon="calendar" label="Change period" tone="onSlate"></x-import>
    </div>
    <div>
      <div class="body" style="color: var(--on-slate-muted)">Spent in October</div>
      <div class="figure-xl k-num" style="margin-top: 4px">0<span class="figure-unit" style="color: var(--on-slate-muted)">.00 ETB</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <div style="padding: 12px; border-radius: var(--radius-control); background: var(--ghost-fill); border: 1px solid var(--ghost-line); display: flex; flex-direction: column; gap: 2px"><span class="micro" style="color: var(--on-slate-muted)">Today</span><span class="figure-s k-num">0</span></div>
      <div style="padding: 12px; border-radius: var(--radius-control); background: var(--ghost-fill); border: 1px solid var(--ghost-line); display: flex; flex-direction: column; gap: 2px"><span class="micro" style="color: var(--on-slate-muted)">A day, avg</span><span class="figure-s k-num">0</span></div>
      <div style="padding: 12px; border-radius: var(--radius-control); background: var(--ghost-fill); border: 1px solid var(--ghost-line); display: flex; flex-direction: column; gap: 2px"><span class="micro" style="color: var(--on-slate-muted)">Of spending</span><span class="figure-s k-num">0%</span></div>
    </div>
  </div>

  <div class="k-screen__sheet" style="top: 340px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 16px">
      <span style="width: 56px; height: 56px; border-radius: var(--radius-control); background: var(--well); color: var(--ink-muted); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Kash.Icon" name="chart" size="{{big}}"></x-import></span>
      <div>
        <h2 class="title-s" style="margin: 0">No Health spending in October</h2>
        <p class="body" style="margin: 8px 0 0; color: var(--ink-muted); font-weight: 400">When you label a payment Health, it shows up here.</p>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { big: 26 }; }
}
</script>
</body>
</html>
