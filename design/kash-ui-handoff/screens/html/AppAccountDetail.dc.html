<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Account detail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppAccounts.dc.html"></x-import>
      <div style="display: flex; align-items: center; gap: 10px">
        <x-import component-from-global-scope="Kash.BankBadge" code="CBE" size="{{badge}}"></x-import>
        <span class="body-strong">Commercial Bank</span>
      </div>
      <span style="width: 44px; flex-shrink: 0" aria-hidden="true"></span>
    </div>
    <div>
      <div class="body" style="color: var(--on-slate-muted)">Balance · <span class="k-num">•••• 4607</span></div>
      <div class="figure-xl k-num" style="margin-top: 4px">12,340<span class="figure-unit" style="color: var(--on-slate-muted)">.48 ETB</span></div>
    </div>
  </div>

  <div class="k-screen__sheet" style="top: 248px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
      <x-import component-from-global-scope="Kash.SearchField" placeholder="Search this account"></x-import>
      <div style="display: flex; align-items: center; gap: 8px">
        <x-import component-from-global-scope="Kash.Chip">1W</x-import>
        <x-import component-from-global-scope="Kash.Chip" selected="{{yes}}">1M</x-import>
        <x-import component-from-global-scope="Kash.Chip">1Y</x-import>
        <x-import component-from-global-scope="Kash.Chip">All</x-import>
        <span style="flex: 1"></span>
        <span class="label k-num" style="color: var(--ink-muted)">Net −2,390</span>
      </div>
    </div>
    <div class="k-screen__body">
      <x-import component-from-global-scope="Kash.DayHeader" label="Today"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="bekelu beyene" time="12:36" category="Family" amount="160" direction="in" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="To Telebirr" time="9:02" category="Own accounts" amount="500" direction="transfer" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="Kaldi's Coffee Bole" time="8:14" category="Food" amount="297" direction="out" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.DayHeader" label="Yesterday"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="Ride Addis" time="18:40" category="Transport" amount="600" direction="out" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="Shoa Supermarket" time="13:05" category="Food" amount="1453" direction="out" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="Ethio Telecom" time="9:20" category="Airtime" amount="50" direction="out" href="AppTransaction.dc.html"></x-import>
      <x-import component-from-global-scope="Kash.DayHeader" label="Sunday, 25 Oct"></x-import>
      <x-import component-from-global-scope="Kash.TransactionRow" name="Salary — Afro Trading PLC" time="10:00" category="Salary" amount="18500" direction="in" href="AppTransaction.dc.html"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { badge: 32, yes: true }; }
}
</script>
</body>
</html>
