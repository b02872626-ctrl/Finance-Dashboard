<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Home, nothing yet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="wordmark">kash</span>
      <div style="display: flex; gap: var(--gap-s)">
        <x-import component-from-global-scope="Kash.IconButton" icon="plus" label="Add transaction" tone="onSlate" href="AppAdd.dc.html"></x-import>
        <x-import component-from-global-scope="Kash.IconButton" icon="settings" label="Settings" tone="onSlate" href="AppSettings.dc.html"></x-import>
      </div>
    </div>
    <div>
      <div class="body" style="color: var(--on-slate-muted)">Total balance</div>
      <div class="figure-xl k-num" style="margin-top: 4px">0<span class="figure-unit" style="color: var(--on-slate-muted)">.00 ETB</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius-control); background: var(--ghost-fill); border: 1px solid var(--ghost-line)">
      <x-import component-from-global-scope="Kash.Icon" name="sms" size="{{icon}}"></x-import>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="body-strong">Listening for bank SMS</span>
        <span class="caption" style="color: var(--on-slate-muted)">New transactions show up here as they arrive.</span>
      </div>
    </div>
  </div>

  <div class="k-screen__sheet k-screen__sheet--tabbed" style="top: 352px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 12px">
      <span style="width: 56px; height: 56px; border-radius: var(--radius-control); background: var(--well); color: var(--ink-muted); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Kash.Icon" name="history" size="{{big}}"></x-import></span>
      <div>
        <h2 class="title-s" style="margin: 0">No transactions yet</h2>
        <p class="body" style="margin: 8px 0 0; color: var(--ink-muted); font-weight: 400">Paid in cash? Add it by hand. Everything from your bank SMS fills in on its own.</p>
      </div>
      <x-import component-from-global-scope="Kash.Button" variant="secondary" icon="plus" href="AppAdd.dc.html" style="width: 220px">Add a transaction</x-import>
    </div>
    <x-import component-from-global-scope="Kash.TabBar" active="home" hrefs="{{tabs}}" style="position: absolute; left: 0; right: 0; bottom: 0"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      icon: 22, big: 26,
      tabs: { home: 'AppHome.dc.html', accounts: 'AppAccounts.dc.html', history: 'AppHistory.dc.html', analytics: 'AppAnalytics.dc.html' }
    };
  }
}
</script>
</body>
</html>
