<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Edit account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 22px">
    <div style="display: flex; align-items: center; gap: 14px">
      <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppSettings.dc.html"></x-import>
      <h1 class="title-xs" style="margin: 0">Your account</h1>
    </div>
    <div style="display: flex; justify-content: center">
      <span class="title-m" aria-hidden="true" style="width: 80px; height: 80px; border-radius: var(--radius-card); background: var(--sand); color: var(--slate-ink); display: flex; align-items: center; justify-content: center">MA</span>
    </div>
  </div>

  <div class="k-screen__sheet" style="top: 236px; padding-bottom: 24px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; gap: 16px; padding-top: 8px">
      <x-import component-from-global-scope="Kash.TextField" label="Name" default-value="Meron Alemu" id="name"></x-import>
      <div class="k-field">
        <label for="email" class="k-field__label">Email</label>
        <input id="email" class="k-field__input" type="email" value="meron@example.com" readonly style="background: var(--well); color: var(--ink-muted)">
        <span class="k-field__hint">Your sign-in email can't be changed here.</span>
      </div>
      <div style="flex: 1"></div>
      <x-import component-from-global-scope="Kash.Button" variant="primary" disabled="{{yes}}">Save changes</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
