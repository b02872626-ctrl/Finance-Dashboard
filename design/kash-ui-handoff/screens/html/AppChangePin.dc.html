<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Change PIN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
.key{height:64px;border:0;border-radius:var(--radius-control);background:var(--ghost-fill);color:var(--on-slate);font-family:var(--font-sans);font-size:24px;font-weight:600;cursor:pointer}
.key--plain{background:transparent}
.dot{width:14px;height:14px;border-radius:999px;box-sizing:border-box;border:2px solid var(--ghost-line)}
.dot--on{border:0;background:var(--on-slate)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--slate); color: var(--on-slate); font-family: var(--font-sans); display: flex; flex-direction: column; padding: var(--top-safe) var(--inset-onboarding) 32px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 14px"><x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppSettings.dc.html"></x-import><span class="title-xs">Change PIN</span></div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center">
    <span style="width: 56px; height: 56px; border-radius: var(--radius-control); background: var(--ghost-fill); border: 1px solid var(--ghost-line); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Kash.Icon" name="lock" size="{{icon}}"></x-import></span>
    <div>
      <h1 class="title-m" style="margin: 0">Enter your current PIN</h1>
      <p class="body-l" style="margin: 8px 0 0; color: var(--on-slate-muted)">Then you&#39;ll choose a new one.</p>
    </div>
    <div role="img" aria-label="3 of 4 digits entered" style="display: flex; gap: 18px">
      <span class="dot dot--on"></span><span class="dot dot--on"></span><span class="dot dot--on"></span><span class="dot"></span>
    </div>
  </div>

  <div role="group" aria-label="Keypad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
    <button class="key k-num">1</button><button class="key k-num">2</button><button class="key k-num">3</button>
    <button class="key k-num">4</button><button class="key k-num">5</button><button class="key k-num">6</button>
    <button class="key k-num">7</button><button class="key k-num">8</button><button class="key k-num">9</button>
    <span></span><button class="key k-num">0</button>
    <button class="key key--plain" aria-label="Delete last digit" style="display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="M12 9.5l5 5M17 9.5l-5 5"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { icon: 24 }; }
}
</script>
</body>
</html>
