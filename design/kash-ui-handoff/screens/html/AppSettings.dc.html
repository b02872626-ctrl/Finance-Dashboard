<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 22px">
    <div style="display: flex; align-items: center; gap: 14px">
      <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppHome.dc.html"></x-import>
      <h1 class="title-xs" style="margin: 0">Settings</h1>
    </div>
    <a href="AppEditAccount.dc.html" style="display: flex; align-items: center; gap: 14px">
      <span class="title-s" aria-hidden="true" style="width: 56px; height: 56px; border-radius: var(--radius-control); background: var(--sand); color: var(--slate-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0">MA</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span class="title-s">Meron Alemu</span>
        <span class="label" style="color: var(--on-slate-muted)">meron@example.com</span>
      </span>
      <span class="label" style="color: var(--on-slate-muted)">Edit</span>
    </a>
  </div>

  <div class="k-screen__sheet" style="top: 236px; padding-bottom: 24px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; gap: 14px">

      <nav aria-label="Settings" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card)">
        <a href="AppPrivacy.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><x-import component-from-global-scope="Kash.Icon" name="eye" size="{{icon}}"></x-import><span class="body" style="flex: 1">Privacy and data</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
        <a href="AppNotifications.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><x-import component-from-global-scope="Kash.Icon" name="sms" size="{{icon}}"></x-import><span class="body" style="flex: 1">Notifications</span><span class="label" style="color: var(--ink-muted)">On</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
        <a href="AppChangePin.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><x-import component-from-global-scope="Kash.Icon" name="lock" size="{{icon}}"></x-import><span class="body" style="flex: 1">Change PIN</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
        <a href="AppAccounts.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><x-import component-from-global-scope="Kash.Icon" name="card" size="{{icon}}"></x-import><span class="body" style="flex: 1">Banks Kash follows</span><span class="label k-num" style="color: var(--ink-muted)">3</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
        <a href="AppExport.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><x-import component-from-global-scope="Kash.Icon" name="export" size="{{icon}}"></x-import><span class="body" style="flex: 1">Export transactions</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
        <a href="AppSettings.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px"><x-import component-from-global-scope="Kash.Icon" name="external" size="{{icon}}"></x-import><span class="body" style="flex: 1">Email support</span><x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{small}}"></x-import></a>
      </nav>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card)">
        <x-import component-from-global-scope="Kash.Icon" name="calendar" size="{{icon}}"></x-import>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="body">Calendar</span><span class="caption" style="color: var(--ink-muted)">Changes every date in the app</span></span>
        <div role="group" aria-label="Calendar" style="display: flex; gap: 6px">
          <x-import component-from-global-scope="Kash.Chip" selected="{{yes}}" label="Gregorian">GC</x-import>
          <x-import component-from-global-scope="Kash.Chip" label="Ethiopian">EC</x-import>
        </div>
      </div>

      <div style="flex: 1"></div>

      <x-import component-from-global-scope="Kash.Button" variant="secondary" href="AppSignIn.dc.html">Log out</x-import>
      <a href="AppDeleteAccount.dc.html" class="k-btn k-btn--quiet" style="color: var(--money-out)">Delete account</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { icon: 20, small: 16, yes: true }; }
}
</script>
</body>
</html>
