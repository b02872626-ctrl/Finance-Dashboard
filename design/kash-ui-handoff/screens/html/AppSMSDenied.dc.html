<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — SMS denied</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: var(--top-safe) var(--inset-onboarding) 28px; gap: 28px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 16px">
    <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" href="AppAllowSMS.dc.html"></x-import>
    <x-import component-from-global-scope="Kash.StepBar" current="{{one}}" total="{{three}}" label="Step 1 of 3" style="flex: 1"></x-import>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>

  <div>
    <h1 class="title-l" style="margin: 0">Kash can't see<br>your bank SMS yet</h1>
    <p class="body-l" style="margin: 14px 0 0; color: var(--ink-muted)">Without it, nothing imports by itself. You can turn it on in Android settings any time.</p>
  </div>

  <div style="flex: 1"></div>

  <div style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <span class="label" style="color: var(--ink-muted)">In settings, tap</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
      <li style="display: flex; align-items: center; gap: 12px"><span class="label k-num" style="width: 28px; height: 28px; border-radius: var(--radius-chip); background: var(--well); display: flex; align-items: center; justify-content: center; flex-shrink: 0">1</span><span class="body">Permissions</span></li>
      <li style="display: flex; align-items: center; gap: 12px"><span class="label k-num" style="width: 28px; height: 28px; border-radius: var(--radius-chip); background: var(--well); display: flex; align-items: center; justify-content: center; flex-shrink: 0">2</span><span class="body">SMS</span></li>
      <li style="display: flex; align-items: center; gap: 12px"><span class="label k-num" style="width: 28px; height: 28px; border-radius: var(--radius-chip); background: var(--well); display: flex; align-items: center; justify-content: center; flex-shrink: 0">3</span><span class="body">Allow</span></li>
    </ol>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <x-import component-from-global-scope="Kash.Button" variant="primary" icon="external" href="AppSources.dc.html">Open settings</x-import>
    <x-import component-from-global-scope="Kash.Button" variant="quiet" href="AppSignIn.dc.html">Add transactions by hand</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { one: 1, three: 3 }; }
}
</script>
</body>
</html>
