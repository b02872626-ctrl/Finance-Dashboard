<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kash — All caught up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kash/tokens.css">
<link rel="stylesheet" href="ds/kash/components/bundle.css">
<script src="ds/kash/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.88}
</style>
</helmet>
<div class="k-screen" style="width: 390px; height: 844px">

  <div class="k-screen__hero" style="gap: 18px">
    <div style="display: flex; align-items: center; gap: 14px">
      <x-import component-from-global-scope="Kash.IconButton" icon="back" label="Back" tone="onSlate" href="AppHome.dc.html"></x-import>
      <span class="title-xs" style="flex: 1">Review</span>
      <span class="label k-num" style="color: var(--on-slate-muted)">6 of 6</span>
    </div>
    <x-import component-from-global-scope="Kash.StepBar" current="{{six}}" total="{{six}}" tone="onSlate" label="6 of 6 reviewed"></x-import>
  </div>

  <div class="k-screen__sheet" style="top: 168px; padding-bottom: 28px">
    <span class="k-screen__handle" aria-hidden="true"></span>
    <div class="k-screen__body" style="display: flex; flex-direction: column; gap: 22px">

      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: var(--radius-card); background: var(--slate); color: var(--sand); display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
        <div>
          <h2 class="title-m" style="margin: 0">All caught up</h2>
          <p class="body-l" style="margin: 8px 0 0; color: var(--ink-muted)">Today's 6 transactions are sorted.<br>We'll nudge you when new SMS arrive.</p>
        </div>
      </div>

      <a href="AppReview.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-card)">
        <span style="width: 40px; height: 40px; border-radius: var(--radius-field); background: var(--well); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><x-import component-from-global-scope="Kash.Icon" name="history" size="{{icon}}"></x-import></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span class="body-strong">12 older ones need a category</span>
          <span class="caption" style="color: var(--ink-muted)">From before you installed Kash</span>
        </span>
        <x-import component-from-global-scope="Kash.Icon" name="chevronRight" size="{{icon}}"></x-import>
      </a>

      <x-import component-from-global-scope="Kash.Button" variant="primary" href="AppHome.dc.html">Back to home</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { six: 6, icon: 20 }; }
}
</script>
</body>
</html>
