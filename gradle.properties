# Increase Gradle daemon heap to fix OOM / GC thrashing during dexing
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# org.gradle.java.home is intentionally unset — Gradle picks JAVA_HOME from the
# environment so the project builds on both Windows (Android Studio JBR) and macOS
# (Homebrew openjdk@17).

# Enable Gradle build cache and parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Android-specific
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Work around "Could not connect to Kotlin compile daemon" by compiling in-process.
# (Slightly slower, but far more reliable on some Windows/IDE setups.)
kotlin.compiler.execution.strategy=in-process
